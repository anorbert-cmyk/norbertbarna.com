name: Verify live portfolio release

on:
  pull_request:
    paths: ['.github/workflows/verify-live-release.yml']

permissions:
  contents: read

jobs:
  live:
    if: github.head_ref == 'codex/verify-live-release-84aa215' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify public HTTP responses, exact release files and browser playback
        shell: bash
        run: |
          mkdir -p live-verification
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          import { chromium } from '@playwright/test';
          const origin = 'https://www.barnanorbert.com';
          const report = { release: '84aa21547e6408d964c9c1245e5b08b79624a1fb', origin, checkedAt: new Date().toISOString(), pages: [], assets: [], media: [], errors: [] };
          let browser;
          try {
            for (const path of ['/', '/works', ...['benker','bitpanda','instructure','kineticare','onrobot','raiffeisen','sportsgambit'].map(s => '/work/' + s)]) {
              const response = await fetch(origin + path, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) });
              assert.equal(response.status, 200, path + ' HTTP status');
              const html = await response.text();
              assert(html.includes('media.f100642e44eb.js'), path + ' must serve the new media release');
              assert(html.includes('responsive.098e57e532c9.css'), path + ' must serve the new CSS release');
              assert(html.includes('animations.f168483d205e.js'), path + ' must serve the new animation release');
              assert.equal((html.match(/data-motion-toggle/g) || []).length, 1, path + ' motion control count');
              report.pages.push({ path, status: response.status, finalUrl: response.url, releaseReferences: true });
            }
            for (const path of ['assets/css/responsive.098e57e532c9.css', 'assets/js/animations.f168483d205e.js', 'assets/js/media.f100642e44eb.js']) {
              const response = await fetch(origin + '/' + path, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) });
              assert.equal(response.status, 200, path);
              const bytes = Buffer.from(await response.arrayBuffer());
              assert(bytes.equals(readFileSync(path)), path + ' differs from tested repository bytes');
              assert(response.headers.get('cache-control')?.includes('immutable'), path + ' immutable cache');
              report.assets.push({ path, status: response.status, sha256: createHash('sha256').update(bytes).digest('hex'), cacheControl: response.headers.get('cache-control') });
            }
            for (const path of ['/robots.txt', '/sitemap.xml', '/llms.txt']) {
              const response = await fetch(origin + path, { signal: AbortSignal.timeout(20000) });
              assert.equal(response.status, 200, path);
              report.pages.push({ path, status: response.status });
            }
            const missing = await fetch(origin + '/release-verification-not-a-page', { signal: AbortSignal.timeout(20000) });
            assert.equal(missing.status, 404, 'real 404');
            const icon = await fetch(origin + '/favicon.ico', { redirect: 'manual', signal: AbortSignal.timeout(20000) });
            assert.equal(icon.status, 301, 'favicon canonical redirect');
            report.notFoundStatus = missing.status;
            report.favicon = { status: icon.status, location: icon.headers.get('location') };
            browser = await chromium.launch();
            for (const mobile of [false, true]) {
              const name = mobile ? 'mobile' : 'desktop';
              const context = await browser.newContext({ viewport: { width: mobile ? 390 : 1366, height: 900 }, isMobile: mobile, hasTouch: mobile, reducedMotion: 'no-preference' });
              const page = await context.newPage();
              page.on('pageerror', error => report.errors.push({ viewport: name, message: error.message }));
              for (const [label, path, selector] of [
                ['home', '/', '.home-about-video > video'],
                ['instructure', '/work/instructure', '.background-video > video'],
                ['kineticare-hero', '/work/kineticare', '.kineticare-hero-bg > video'],
                ['kineticare-walkthrough', '/work/kineticare', '.kineticare-browser-frame > video']
              ]) {
                await page.goto(origin + path, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForFunction(() => Boolean(window.PortfolioMedia));
                await page.locator(selector).evaluate(video => video.scrollIntoView({ block: 'center', behavior: 'instant' }));
                await page.waitForFunction(selector => {
                  const v = document.querySelector(selector);
                  return v && !v.paused && v.currentTime > .2 && v.muted && v.playsInline && !v.controls;
                }, selector, { timeout: 20000 });
                assert.equal(await page.locator('.motion-video-toggle, [data-w-bg-video-control], video[controls]').count(), 0);
                report.media.push({ viewport: name, label, path, ...await page.locator(selector).evaluate(v => ({ playing: !v.paused, currentTime: v.currentTime, muted: v.muted, inline: v.playsInline, controls: v.controls })) });
                if (label === 'instructure') {
                  await page.waitForFunction(() => document.querySelector('.background-video > video').currentTime > 5, undefined, { timeout: 15000 });
                  await page.screenshot({ path: 'live-verification/' + name + '-instructure.png' });
                }
              }
              await page.goto(origin + '/work/onrobot', { waitUntil: 'networkidle', timeout: 30000 });
              const note = page.locator('.case-evidence-note');
              await note.scrollIntoViewIfNeeded();
              await page.waitForTimeout(1200);
              const style = await note.evaluate(e => { const s = getComputedStyle(e); return { background: s.backgroundColor, border: s.borderLeftWidth, padding: s.paddingLeft, text: e.textContent }; });
              assert.equal(style.background, 'rgba(0, 0, 0, 0)');
              assert.equal(style.border, '0px');
              assert.equal(style.padding, '0px');
              assert(style.text.includes('12 tasks with 18 operators'));
              await page.screenshot({ path: 'live-verification/' + name + '-onrobot.png' });
              await context.close();
            }
            assert.deepEqual(report.errors, [], 'live browser errors');
            report.status = 'PASS';
          } catch (error) {
            report.status = 'FAIL';
            report.failure = error.stack;
            throw error;
          } finally {
            if (browser) await browser.close();
            writeFileSync('live-verification/result.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          }
          NODE
      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-portfolio-release-84aa215
          path: live-verification/
          retention-days: 7
          if-no-files-found: error
