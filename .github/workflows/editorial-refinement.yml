name: Editorial integration (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: editorial-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/editorial-autoplay-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: codex/editorial-autoplay-release
      BASELINE: d75c57d80f0c368e659d365aa716b14be3ac165c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact branch and unchanged main
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$BASELINE"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
      - name: Apply the reproduced integration fixes
        run: node .github/refinement-input/scripts/complete-fixes.mjs
      - run: npm ci
      - name: Static, SEO, server, syntax and dependency checks
        run: |
          set -o pipefail
          mkdir -p /tmp/editorial-verification
          npm test 2>&1 | tee /tmp/editorial-verification/npm-test.log
          node --check server.js
          node --check assets/js/animations.js
          node --check assets/js/navigation.js
          node --check assets/js/media.js
          git diff --check
          npm audit --omit=dev --audit-level=high
          git diff --stat > /tmp/editorial-verification/diff-stat.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser and accessibility suite
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/editorial-verification/browser-tests.log
      - name: Persist verified implementation to the feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets package.json server.js scripts tests index.html works.html work 404.html
          git diff --cached --check
          git commit -m 'Fix mobile demonstration visibility and validate all autoplay surfaces'
          git rev-parse HEAD > /tmp/editorial-verification/validated-commit.txt
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-release-validation
          path: |
            /tmp/editorial-verification/
            test-results/
          if-no-files-found: warn
          retention-days: 7
