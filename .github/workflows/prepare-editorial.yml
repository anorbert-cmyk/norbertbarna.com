name: Prepare verified portfolio refinement

on:
  pull_request:
    paths:
      - '.github/refinement/**'
      - '.github/workflows/prepare-editorial.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: portfolio-refinement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ship-editorial-autoplay'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded portfolio changes
        run: node .github/refinement/apply.mjs "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/change-manifest.json"
      - name: Syntax and whitespace checks
        run: |
          node --check server.js
          node --check assets/js/media.js
          node --check assets/js/animations.js
          node --check assets/js/navigation.js
          git diff --check
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Static, server, editorial and SEO checks
        run: npm test | tee "$RUNNER_TEMP/static-checks.txt"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser playback, responsive UX and accessibility
        run: npm run test:e2e -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Export verified git objects without updating any branch
        run: node .github/refinement/export-commit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-refinement-verification
          path: |
            ${{ runner.temp }}/prepared-commit.json
            ${{ runner.temp }}/change-manifest.json
            ${{ runner.temp }}/static-checks.txt
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: error
