name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax-check JS
        run: |
          node --check server.js
          node --check assets/js/animations.js
          node --check assets/js/media.js
          node --check assets/js/navigation.js
      - name: Site invariants
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser UX and accessibility
        run: npm run test:e2e
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
